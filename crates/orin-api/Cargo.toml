[package]
name = "orin-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
axum = "=0.8.9"
futures-util = "0.3.32"
libc = "0.2"
minijinja = { version = "2", features = ["json"] }
orin-engine.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }

base64 = "0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

[lints]
workspace = true
