[package]
name = "orinfer-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
orinfer-device.workspace = true
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-12060"] }
libloading = "=0.9.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

half.workspace = true
libc = "=0.2.191"
memmap2 = "=0.9.12"
safetensors = "=0.8.0"

orinfer-model-sdk.workspace = true
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"
tempfile = "=3.27.0"
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz", "optimization"] }
realfft = { version = "=3.5.1", default-features = false, features = ["neon"] }
rayon = "=1.12.0"

[dev-dependencies]
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["encoder"] }

[build-dependencies]
cc = "=1.11.0"
