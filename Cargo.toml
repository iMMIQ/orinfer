[workspace]
members = ["crates/orinfer-engine", "crates/orinfer-cli", "crates/orinfer-api", "crates/orinfer-model-sdk", "crates/orinfer-models"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "LGPL-3.0-or-later"

[workspace.dependencies]
orinfer-api = { path = "crates/orinfer-api" }
orinfer-engine = { path = "crates/orinfer-engine" }
orinfer-model-sdk = { path = "crates/orinfer-model-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
half = "=2.7.1"
sha2 = "=0.11.0"
hex = "=0.4.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
dead_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
