[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orinfer-tools"
version = "0.4.6"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = ["ruff>=0.17.3"]

[tool.uv]
package = true
exclude-newer = "7 days"
prerelease = "disallow"

[tool.setuptools.package-dir]
orinfer_build = "python/orinfer_build"
kernels = "kernels"
tools = "tools"
tests = "tests"

[tool.setuptools.package-data]
"orinfer_build" = ["**/*.jinja", "**/*.c", "**/*.json", "**/LICENSE"]

[tool.uv.workspace]
exclude = ["tools/environments/cuda"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", "target", ".venv"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B007",
    "B008",
    "B019",
    "B020",
    "B904",
    "B905",
    "C401",
    "C405",
    "C417",
    "C420",
    "PERF102",
    "PIE810",
    "PLW0127",
    "PLW1510",
    "PLW3301",
    "RET502",
    "RET503",
    "RUF012",
    "RUF017",
    "SIM105",
]
# TileLang tensor names follow the mathematical notation in the operator ABI.
ignore = ["E741"]
