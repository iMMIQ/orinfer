[project]
name = "orinfer-tools"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = ["ruff>=0.17.3"]

[tool.uv]
package = false

[tool.uv.workspace]
exclude = ["tools/environments/cuda"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", "target", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLW0127"]
# TileLang tensor names follow the mathematical notation in the operator ABI.
ignore = ["E741"]
